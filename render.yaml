services:
  - type: web
    name: telegram-group-forwarder
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SOURCE_GROUP_ID
        sync: false
      - key: DESTINATION_CHANNEL_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
